{% extends "base.html" %}

{% block title %}Add Expense — Spendly{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container">
        <div class="auth-header">
            <h1 class="auth-title">Add Expense</h1>
            <p class="auth-subtitle">Record a new expense to your account.</p>
        </div>
        <div class="auth-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}
            <form method="POST" action="{{ url_for('add_expense') }}">
                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" name="amount" class="form-input"
                           placeholder="0.00" step="0.01" min="0.01"
                           value="{{ form.amount if form else '' }}" required>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" class="form-input"
                           value="{{ form.date if form else '' }}" required>
                </div>
                <div class="form-group">
                    <label for="description">Description <span class="label-hint">(optional)</span></label>
                    <input type="text" id="description" name="description" class="form-input"
                           placeholder="e.g. Grocery run"
                           value="{{ form.description if form else '' }}">
                </div>
                <div class="form-group">
                    <label for="category_id">Category <span class="label-hint">(optional)</span></label>
                    <select id="category_id" name="category_id" class="form-input">
                        <option value="">No category</option>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}"
                            {% if form and form.category_id == cat.id|string %}selected{% endif %}>
                            {{ cat.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="btn-submit">Add Expense</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
